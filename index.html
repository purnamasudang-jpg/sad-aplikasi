<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Arsip Digital</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #1e3a8a; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #374151; }
        input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1d4ed8; }
        .switch-text { text-align: center; margin-top: 15px; font-size: 14px; }
        .switch-text a { color: #2563eb; text-decoration: none; cursor: pointer; }
        .switch-text a:hover { text-decoration: underline; }
        .hidden { display: none; }
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 14px; text-align: center; }
        .alert-error { background-color: #fee2e2; color: #991b1b; }
        .alert-success { background-color: #d1fae5; color: #065f46; }
    </style>
</head>
<body>

    <div class="card">
        <!-- FORM LOGIN -->
        <div id="login-box">
            <h2>Login Akun SAD</h2>
            <div id="login-alert"></div>
            <form id="form-login">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="login-user" required placeholder="Masukkan username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-pass" required placeholder="Masukkan password">
                </div>
                <button type="submit">Masuk</button>
            </form>
            <div class="switch-text">
                Belum punya akun? <a onclick="tukarForm('register')">Daftar Akun Baru</a>
            </div>
        </div>

        <!-- FORM PENDAFTARAN -->
        <div id="register-box" class="hidden">
            <h2>Daftar Akun Baru</h2>
            <div id="reg-alert"></div>
            <form id="form-register">
                <div class="form-group">
                    <label>Username Baru</label>
                    <input type="text" id="reg-user" required placeholder="Buat username">
                </div>
                <div class="form-group">
                    <label>Password Baru</label>
                    <input type="password" id="reg-pass" required placeholder="Buat password">
                </div>
                <button type="submit">Buat Akun</button>
            </form>
            <div class="switch-text">
                Sudah punya akun? <a onclick="tukarForm('login')">Kembali ke Login</a>
            </div>
        </div>
    </div>

    <script>
        function tukarForm(target) {
            if(target === 'register') {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('register-box').classList.remove('hidden');
            } else {
                document.getElementById('register-box').classList.add('hidden');
                document.getElementById('login-box').classList.remove('hidden');
            }
        }

        // Proses Login
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-user').value;
            const password = document.getElementById('login-pass').value;
            const alertBox = document.getElementById('login-alert');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if(res.ok) {
                    window.location.href = '/dashboard.html';
                } else {
                    alertBox.innerHTML = `<div class="alert alert-error">${data.message}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-error">Terjadi kesalahan koneksi ke server.</div>`;
            }
        });

        // Proses Pendaftaran
        document.getElementById('form-register').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('reg-user').value;
            const password = document.getElementById('reg-pass').value;
            const alertBox = document.getElementById('reg-alert');

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if(res.ok) {
                    alertBox.innerHTML = `<div class="alert alert-success">Akun berhasil dibuat! Silakan login.</div>`;
                    setTimeout(() => tukarForm('login'), 1500);
                } else {
                    alertBox.innerHTML = `<div class="alert alert-error">${data.message}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-error">Terjadi kesalahan koneksi ke server.</div>`;
            }
        });
    </script>
</body>
</html>
