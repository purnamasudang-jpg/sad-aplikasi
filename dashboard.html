<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistem Arsip Digital</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 15px; margin-bottom: 25px; }
        h2 { color: #1e3a8a; margin: 0; }
        .btn-keluar { background-color: #dc2626; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-keluar:hover { background-color: #b91c1c; }
        .section { margin-bottom: 30px; background: #f9fafb; padding: 20px; border-radius: 6px; border: 1px solid #e5e7eb; }
        .section h3 { margin-top: 0; color: #374151; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #4b5563; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; }
        button.btn-primary { background-color: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button.btn-primary:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h2>Sistem Arsip Digital (SAD)</h2>
                <p style="margin: 5px 0 0 0; color: #6b7280; font-size: 14px;">Kelola dokumen dan arsip Anda secara terorganisir.</p>
            </div>
            <button class="btn-keluar" onclick="logout()">Keluar</button>
        </div>

        <!-- Kelola Folder Arsip -->
        <div class="section">
            <h3>Buat Folder Arsip Baru</h3>
            <form id="form-folder">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="nama-folder" required placeholder="Nama Folder Baru (misal: Surat Masuk 2026)">
                    <button type="submit" class="btn-primary" style="white-space: nowrap;">Buat Folder</button>
                </div>
            </form>
        </div>

        <!-- Upload & Simpan Dokumen Arsip -->
        <div class="section">
            <h3>Upload & Simpan Dokumen Arsip</h3>
            <form id="form-upload">
                <div class="form-group">
                    <label>Pilih Folder</label>
                    <select id="select-folder" required>
                        <option value="">-- Pilih Folder --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Judul Arsip / Dokumen</label>
                    <input type="text" id="judul-arsip" required placeholder="Judul arsip">
                </div>
                <div class="form-group">
                    <label>Nomor Surat / Dokumen</label>
                    <input type="text" id="nomor-surat" placeholder="Nomor surat (opsional)">
                </div>
                <div class="form-group">
                    <label>Instansi Asal / Tujuan</label>
                    <input type="text" id="instansi" placeholder="Instansi terkait (opsional)">
                </div>
                <div class="form-group">
                    <label>Tanggal Dokumen</label>
                    <input type="date" id="tgl-dokumen">
                </div>
                <div class="form-group">
                    <label>Lokasi Fisik Dokumen</label>
                    <input type="text" id="lokasi-fisik" placeholder="misal: Lemari A, Boks No. 3 (opsional)">
                </div>
                <div class="form-group">
                    <label>Keterangan Tambahan</label>
                    <textarea id="keterangan" rows="3" placeholder="Catatan/keterangan singkat (opsional)"></textarea>
                </div>
                <button type="submit" class="btn-primary">Simpan Arsip</button>
            </form>
        </div>
    </div>

    <script>
        // Fungsi Keluar / Logout
        async function logout() {
            await fetch('/api/logout');
            window.location.href = '/index.html';
        }

        // Ambil daftar folder untuk dropdown
        async function loadFolder() {
            try {
                const res = await fetch('/api/folders');
                const folders = await res.json();
                const select = document.getElementById('select-folder');
                select.innerHTML = '<option value="">-- Pilih Folder --</option>';
                folders.forEach(f => {
                    select.innerHTML += `<option value="${f.id}">${f.nama_folder}</option>`;
                });
            } catch (err) {
                console.error("Gagal memuat folder");
            }
        }

        // Aksi Buat Folder
        document.getElementById('form-folder').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nama_folder = document.getElementById('nama-folder').value;
            const res = await fetch('/api/folders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nama_folder })
            });
            if(res.ok) {
                alert('Folder berhasil dibuat!');
                document.getElementById('nama-folder').value = '';
                loadFolder();
            } else {
                alert('Gagal membuat folder.');
            }
        });

        // Aksi Simpan Arsip
        document.getElementById('form-upload').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                folder_id: document.getElementById('select-folder').value,
                judul: document.getElementById('judul-arsip').value,
                nomor_surat: document.getElementById('nomor-surat').value,
                instansi: document.getElementById('instansi').value,
                tanggal: document.getElementById('tgl-dokumen').value,
                lokasi_fisik: document.getElementById('lokasi-fisik').value,
                keterangan: document.getElementById('keterangan').value
            };

            const res = await fetch('/api/arsip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if(res.ok) {
                alert('Arsip berhasil disimpan!');
                document.getElementById('form-upload').reset();
            } else {
                alert('Gagal menyimpan arsip.');
            }
        });

        // Muat folder saat halaman dibuka
        loadFolder();
    </script>
</body>
</html>
