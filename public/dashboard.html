<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SAD</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background: #218838; }
        .folder { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; background: #fff; }
        .arsip { background: #f9f9f9; padding: 8px; margin: 5px 0; border-left: 3px solid #007bff; }
        #loginForm, #dashboard { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>Sistem Arsip Digital - SAD</h2>

    <!-- FORM LOGIN -->
    <div id="loginForm">
        <h3>Login</h3>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="loginMsg" style="color:red;"></p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
        <button onclick="logout()" style="background:red; float:right; width:auto; padding: 5px 15px;">Logout</button>
        <h3>Dashboard</h3>
        
        <h4>Buat Folder Baru</h4>
        <input type="text" id="nama_folder" placeholder="Nama Folder (Contoh: Surat Masuk 2026)">
        <button onclick="buatFolder()">Buat Folder</button>

        <hr>
        <h4>Daftar Folder</h4>
        <div id="listFolder"></div>
    </div>

</div>

<script>
const API_URL = ''; 

// CEK APA SUDAH LOGIN
window.onload = () => {
    const userId = localStorage.getItem('userId');
    if(userId){
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadFolders();
    } else {
        document.getElementById('loginForm').style.display = 'block';
    }
}

// 1. FUNGSI LOGIN
async function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    
    const res = await fetch(`${API_URL}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    
    if(data.success){
        localStorage.setItem('userId', data.user.id);
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadFolders();
    } else {
        document.getElementById('loginMsg').innerText = data.error;
    }
}

// 2. LOGOUT
function logout(){
    localStorage.removeItem('userId');
    location.reload();
}

// 3. LOAD FOLDER
async function loadFolders() {
    const userId = localStorage.getItem('userId');
    const res = await fetch(`${API_URL}/api/folders`, {
        headers: { 'user-id': userId }
    });
    const data = await res.json();
    if(data.success){
        let html = '';
        if(data.data.length === 0) {
            html = '<p>Belum ada folder arsip. Buat folder baru di atas.</p>';
        }
        data.data.forEach(folder => {
            html += `
            <div class="folder">
                <h4>📁 ${folder.nama_folder}</h4>
                <input type="text" id="nama_dok_${folder.id}" placeholder="Nama Dokumen">
                <input type="file" id="file_dok_${folder.id}">
                <button onclick="uploadArsip(${folder.id})">Unggah ke Arsip</button>
                <button onclick="loadArsip(${folder.id})" style="background:#007bff;">Lihat Arsip</button>
                <div id="arsip_${folder.id}" style="margin-top:10px;"></div>
            </div>
            `;
        });
        document.getElementById('listFolder').innerHTML = html;
    }
}

// 4. BUAT FOLDER
async function buatFolder(){
    const userId = localStorage.getItem('userId');
    const nama = document.getElementById('nama_folder').value;
    if(!nama) return alert('Nama folder wajib diisi');
    
    const res = await fetch(`${API_URL}/api/folders`, {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json',
            'user-id': userId 
        },
        body: JSON.stringify({ nama_folder: nama })
    });
    const data = await res.json();
    if(data.success) {
        document.getElementById('nama_folder').value = '';
        loadFolders();
    }
}

// 5. UPLOAD ARSIP
// 5. UPLOAD ARSIP
async function uploadArsip(folderId) {
    const userId = localStorage.getItem('userId');
    if (!userId) {
        alert('User ID tidak valid. Silakan login ulang.');
        return logout();
    }

    const nama_dokumen = document.getElementById(`nama_dok_${folderId}`).value;
    const fileInput = document.getElementById(`file_dok_${folderId}`);

    if(!nama_dokumen) return alert('Nama dokumen wajib diisi');

    const formData = new FormData();
    formData.append('judul_arsip', nama_dokumen);
    if (fileInput && fileInput.files[0]) {
        formData.append('berkas', fileInput.files[0]);
    }

    // Mengirim userId via URL parameter agar aman dari masalah header multipart
    const res = await fetch(`${API_URL}/api/folders/${folderId}/arsip?userId=${userId}`, {
        method: 'POST',
        body: formData 
    });
    
    const data = await res.json();
    if(data.success){
        alert('Upload berhasil!');
        document.getElementById(`nama_dok_${folderId}`).value = '';
        fileInput.value = '';
        loadArsip(folderId);
    } else {
        alert('Gagal: ' + (data.error || 'Terjadi kesalahan'));
    }
}

// 6. LIHAT ARSIP
async function loadArsip(folderId){
    const userId = localStorage.getItem('userId');
    const res = await fetch(`${API_URL}/api/folders/${folderId}/arsip`, {
        headers: { 'user-id': userId }
    });
    const data = await res.json();
    if(data.success){
        let html = '<h5>Daftar Dokumen:</h5>';
        if(data.data.length === 0) {
            html += '<p style="font-size: 13px; color: #666;">Belum ada dokumen di folder ini.</p>';
        }
        data.data.forEach(a => {
            html += `<div class="arsip"><b>${a.nama_dokumen}</b> ${a.file_url ? `- <a href="/uploads/${a.file_url}" target="_blank">Lihat File</a>` : ''}</div>`;
        });
        document.getElementById(`arsip_${folderId}`).innerHTML = html;
    }
}
</script>
</body>
</html>
