<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Arsip Digital (SAD)</title>
    <!-- Tailwind CSS untuk Desain Elegan & Modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-box-archive text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">Sistem Arsip Digital</h1>
                    <p class="text-xs text-slate-500">Kelola dokumen instansi secara aman & terorganisir</p>
                </div>
            </div>
            <div id="user-nav" class="hidden flex items-center space-x-4">
                <span id="username-display" class="text-sm font-medium text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg"></span>
                <button onclick="logout()" class="text-sm text-red-600 hover:text-red-700 font-medium px-3 py-1.5 rounded-lg hover:bg-red-50 transition">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">

        <!-- AUTH SECTION (Login & Register Tab) -->
        <div id="auth-section" class="max-w-md mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden my-12">
            <div class="flex border-b border-slate-100 bg-slate-50/50">
                <button id="tab-login-btn" onclick="switchTab('login')" class="flex-1 py-4 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600 bg-white transition">Masuk Akun</button>
                <button id="tab-register-btn" onclick="switchTab('register')" class="flex-1 py-4 text-sm font-semibold text-slate-500 hover:text-slate-800 transition">Daftar Baru</button>
            </div>

            <div class="p-8">
                <!-- Form Login -->
                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Username</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"><i class="fa-solid fa-user"></i></span>
                            <input type="text" id="login-username" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition" placeholder="Masukkan username">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition" placeholder="Masukkan password">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl shadow-lg shadow-indigo-200 transition duration-200 flex items-center justify-center space-x-2">
                        <span>Masuk ke Sistem</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </form>

                <!-- Form Register -->
                <form id="register-form" onsubmit="handleRegister(event)" class="space-y-5 hidden">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Buat Username</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"><i class="fa-solid fa-user-plus"></i></span>
                            <input type="text" id="reg-username" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition" placeholder="Pilih username unik">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Buat Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="reg-password" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition" placeholder="Minimal 6 karakter">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl shadow-lg shadow-emerald-200 transition duration-200 flex items-center justify-center space-x-2">
                        <span>Daftarkan Akun</span>
                        <i class="fa-solid fa-check text-xs"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- DASHBOARD SECTION (Hidden by default until logged in) -->
        <div id="dashboard-section" class="hidden space-y-8">
            <!-- Konten Folder & Arsip Anda yang sudah ada -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                    <i class="fa-solid fa-folder-open text-indigo-600 mr-2"></i> Kelola Folder Arsip
                </h2>
                <!-- Form Buat Folder -->
                <div class="flex gap-3">
                    <input type="text" id="nama-folder" placeholder="Nama Folder (Contoh: Surat Masuk 2026)" class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="buatFolder()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition flex items-center space-x-2">
                        <i class="fa-solid fa-plus"></i>
                        <span>Buat Folder</span>
                    </button>
                </div>
            </div>

            <!-- List Folder & Arsip container -->
            <div id="folder-list-container" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Dinamis dari JavaScript Anda -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        &copy; 2026 Sistem Arsip Digital. All rights reserved.
    </footer>

    <!-- JavaScript Penghubung -->
    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const loginBtn = document.getElementById('tab-login-btn');
            const regBtn = document.getElementById('tab-register-btn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                loginBtn.className = "flex-1 py-4 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600 bg-white transition";
                regBtn.className = "flex-1 py-4 text-sm font-semibold text-slate-500 hover:text-slate-800 transition";
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                regBtn.className = "flex-1 py-4 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600 bg-white transition";
                loginBtn.className = "flex-1 py-4 text-sm font-semibold text-slate-500 hover:text-slate-800 transition";
            }
        }

        // Fungsi interaksi login/register/dashboard disesuaikan dengan script Anda sebelumnya
    </script>
</body>
</html>
