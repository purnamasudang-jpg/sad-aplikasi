<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Arsip Digital - SAD</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f9; color: #333; margin: 0; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .section-box { background: #fdfdfd; border: 1px solid #e2e8f0; padding: 20px; border-radius: 6px; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: span 2; }
        label { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #444; }
        input, select, textarea { padding: 9px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 100%; box-sizing: border-box; }
        textarea { resize: vertical; height: 60px; }
        
        .btn-primary { background: #2c5282; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; font-size: 15px; }
        .btn-primary:hover { background: #1a365d; }
        
        /* List Folder Card Style */
        .folder-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .folder-card { background: #fff; border: 1px solid #cbd5e0; padding: 10px 15px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.2s; }
        .folder-card:hover { border-color: #3182ce; background: #ebf8ff; }
        .folder-card.active { border-color: #2b6cb0; background: #bee3f8; font-weight: bold; }
        
        .table-container { margin-top: 30px; overflow-x: auto; }
        .search-box { float: right; width: 280px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px 12px; text-align: left; vertical-align: middle; }
        th { background: #343a40; color: white; font-weight: 600; }
        tr:nth-child(even) { background: #f8fafc; }
        
        .badge-folder { background: #e2e8f0; color: #2d3748; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }
        .btn-file { background: #38a169; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-size: 12px; font-weight: bold; display: inline-block; }
        .btn-file:hover { background: #2f855a; }
        .btn-danger { background: #e53e3e; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .btn-danger:hover { background: #c53030; }
        
        #loginForm, #dashboard { display: none; }
        .error-msg { color: red; font-size: 13px; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    
    <!-- Form Login -->
    <div id="loginForm" style="max-width: 400px; margin: 40px auto;">
        <h3>Login Sistem Arsip Digital</h3>
        <div class="form-group" style="margin-bottom: 10px;">
            <label>Username</label>
            <input type="text" id="username" placeholder="admin">
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label>Password</label>
            <input type="password" id="password" placeholder="123">
        </div>
        <button class="btn-primary" onclick="login()">Login</button>
        <p id="loginMsg" class="error-msg"></p>
    </div>

    <!-- Dashboard Utama -->
    <div id="dashboard">
        <div class="header-top">
            <h2 style="margin:0; color: #2d3748;">Sistem Arsip Digital - SAD</h2>
            <button onclick="logout()" class="btn-danger" style="width: auto; padding: 8px 16px;">Logout</button>
        </div>

        <!-- 1. Manajemen Folder di Bagian Atas -->
        <div class="section-box">
            <h3 style="margin-top:0; color: #2c5282;">Manajemen Folder Arsip</h3>
            <div class="form-grid" style="align-items: flex-end;">
                <div class="form-group">
                    <label>Nama Folder Baru</label>
                    <input type="text" id="nama_folder_input" placeholder="Contoh: Arsip Keuangan 2026">
                </div>
                <div class="form-group">
                    <label>Tanggal Pembuatan Folder</label>
                    <input type="date" id="folder_tanggal">
                </div>
            </div>
            <button type="button" onclick="buatFolder()" style="background: #3182ce; color:white; border:none; padding: 10px; border-radius:4px; font-weight:bold; cursor:pointer; width: 100%;">+ Simpan Folder Baru</button>
            
            <div style="margin-top: 15px;">
                <label style="margin-bottom: 8px; display: block;">Daftar Folder (Klik folder untuk memilih tujuan upload):</label>
                <div id="folderContainer" class="folder-list">
                    <!-- List Folder akan dimuat di sini -->
                </div>
            </div>
        </div>

        <!-- 2. Form Tambah Dokumen ke Folder yang Dipilih -->
        <div class="section-box" id="formDokumenBox" style="display: none;">
            <h3 style="margin-top:0; color: #2c5282;">Tambah Dokumen ke Folder: <span id="activeFolderName" style="color: #d69e2e;">-</span></h3>
            
            <div class="form-grid">
                <div class="form-group">
                    <label>Tanggal Dokumen (dd/mm/tttt)</label>
                    <input type="date" id="dok_tanggal">
                </div>
                <div class="form-group">
                    <label>Lokasi Fisik</label>
                    <input type="text" id="lokasi_fisik" placeholder="Contoh: Rak B - Map Merah">
                </div>
                <div class="form-group full">
                    <label>Judul Dokumen & No. Surat</label>
                    <input type="text" id="judul_dokumen" placeholder="Contoh: Surat Keputusan Pengangkatan...">
                </div>
                <div class="form-group">
                    <label>Pengirim / Instansi</label>
                    <input type="text" id="pengirim" placeholder="Contoh: Dinas Pendidikan / -">
                </div>
                <div class="form-group">
                    <label>Keterangan Tambahan</label>
                    <input type="text" id="keterangan" placeholder="Catatan ringkas...">
                </div>
                <div class="form-group full">
                    <label>Unggah Berkas Lampiran (File PDF / Foto / Doc)</label>
                    <input type="file" id="berkas">
                </div>
            </div>
            <button class="btn-primary" onclick="simpanDokumen()">Simpan Dokumen ke Folder Ini</button>
        </div>

        <!-- 3. Tabel Daftar Seluruh Dokumen -->
        <div class="table-container">
            <h3 style="display: inline-block; margin:0;">Daftar Seluruh Dokumen</h3>
            <input type="text" id="searchKeyword" class="search-box" placeholder="Cari dokumen..." onkeyup="renderTabel()">
            
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">No</th>
                        <th style="width: 100px;">Tanggal</th>
                        <th style="width: 180px;">Folder</th>
                        <th>Judul Dokumen & No. Surat</th>
                        <th style="width: 120px;">Pengirim</th>
                        <th style="width: 110px;">Lokasi Fisik</th>
                        <th style="width: 110px;">Berkas</th>
                        <th style="width: 80px;">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelArsipBody">
                    <tr><td colspan="8" style="text-align: center; color: #718096;">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
let globalData = { folders: [], arsip: [] };
let selectedFolderId = null;

window.onload = () => {
    if(localStorage.getItem('isLogin') === 'true') {
        showDashboard();
    } else {
        document.getElementById('loginForm').style.display = 'block';
    }
    document.getElementById('folder_tanggal').valueAsDate = new Date();
    document.getElementById('dok_tanggal').valueAsDate = new Date();
}

async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if(data.success){
            localStorage.setItem('isLogin', 'true');
            showDashboard();
        } else {
            document.getElementById('loginMsg').innerText = data.error || 'Login gagal';
        }
    } catch(err) {
        document.getElementById('loginMsg').innerText = 'Koneksi server gagal';
    }
}

function showDashboard() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadData();
}

function logout(){
    localStorage.removeItem('isLogin');
    location.reload();
}

async function loadData() {
    try {
        const res = await fetch('/api/data');
        const data = await res.json();
        if(data.success) {
            globalData = data;
            renderFolders();
            renderTabel();
            
            // Auto pilih folder pertama jika belum ada yang terpilih
            if(globalData.folders.length > 0 && !selectedFolderId) {
                selectFolder(globalData.folders[0].id);
            }
        }
    } catch(err) {
        console.error('Gagal memuat data', err);
    }
}

function renderFolders() {
    const container = document.getElementById('folderContainer');
    if(globalData.folders.length === 0) {
        container.innerHTML = '<span style="color:#718096; font-size:13px;">Belum ada folder. Buat folder baru di atas.</span>';
        document.getElementById('formDokumenBox').style.display = 'none';
        return;
    }

    let html = '';
    globalData.folders.forEach(f => {
        const isActive = f.id === selectedFolderId ? 'active' : '';
        html += `
        <div class="folder-card ${isActive}" onclick="selectFolder(${f.id})">
            📁 <span>${f.nama_folder}</span>
            <small style="color: #666; font-size:11px;">(${f.tanggal})</small>
            <span onclick="event.stopPropagation(); hapusFolder(${f.id})" style="color:red; font-weight:bold; margin-left:8px;" title="Hapus Folder">×</span>
        </div>`;
    });
    container.innerHTML = html;
}

function selectFolder(folderId) {
    selectedFolderId = folderId;
    const folderObj = globalData.folders.find(f => f.id === folderId);
    if(folderObj) {
        document.getElementById('activeFolderName').textContent = folderObj.nama_folder;
        document.getElementById('formDokumenBox').style.display = 'block';
    }
    renderFolders();
}

async function buatFolder() {
    const nama_folder = document.getElementById('nama_folder_input').value.trim();
    const tanggal = document.getElementById('folder_tanggal').value;

    if(!nama_folder) {
        alert('Nama folder wajib diisi!');
        return;
    }

    const res = await fetch('/api/folders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nama_folder, tanggal })
    });
    const data = await res.json();
    if(data.success) {
        document.getElementById('nama_folder_input').value = '';
        document.getElementById('folder_tanggal').valueAsDate = new Date();
        loadData();
        // Pilih folder yang baru dibuat
        selectFolder(data.data.id);
    } else {
        alert('Gagal membuat folder');
    }
}

async function hapusFolder(id) {
    if(!confirm('Menghapus folder ini juga akan menghapus seluruh isi dokumen di dalamnya. Lanjutkan?')) return;
    const res = await fetch(`/api/folders/${id}`, { method: 'DELETE' });
    const data = await res.json();
    if(data.success) {
        selectedFolderId = null;
        loadData();
    } else {
        alert('Gagal menghapus folder');
    }
}

async function simpanDokumen() {
    if(!selectedFolderId) {
        alert('Silakan pilih folder terlebih dahulu di atas!');
        return;
    }

    const tanggal = document.getElementById('dok_tanggal').value;
    const judul_dokumen = document.getElementById('judul_dokumen').value.trim();
    const pengirim = document.getElementById('pengirim').value.trim();
    const lokasi_fisik = document.getElementById('lokasi_fisik').value.trim();
    const keterangan = document.getElementById('keterangan').value.trim();
    const fileInput = document.getElementById('berkas');

    if(!judul_dokumen) {
        alert('Judul dokumen wajib diisi!');
        return;
    }

    const formData = new FormData();
    formData.append('tanggal', tanggal);
    formData.append('folder_id', selectedFolderId);
    formData.append('judul_dokumen', judul_dokumen);
    formData.append('pengirim', pengirim);
    formData.append('lokasi_fisik', lokasi_fisik);
    formData.append('keterangan', keterangan);
    if(fileInput.files[0]) {
        formData.append('berkas', fileInput.files[0]);
    }

    const res = await fetch('/api/arsip', {
        method: 'POST',
        body: formData
    });
    const data = await res.json();
    
    if(data.success) {
        document.getElementById('judul_dokumen').value = '';
        document.getElementById('pengirim').value = '';
        document.getElementById('lokasi_fisik').value = '';
        document.getElementById('keterangan').value = '';
        document.getElementById('berkas').value = '';
        document.getElementById('dok_tanggal').valueAsDate = new Date();
        loadData();
        alert('Dokumen berhasil disimpan ke folder!');
    } else {
        alert('Gagal menyimpan dokumen');
    }
}

function renderTabel() {
    const keyword = document.getElementById('searchKeyword').value.toLowerCase();
    const tbody = document.getElementById('tabelArsipBody');
    
    const filtered = globalData.arsip.filter(a => {
        const folderObj = globalData.folders.find(f => f.id === a.folder_id);
        const folderName = folderObj ? folderObj.nama_folder.toLowerCase() : '';
        return a.judul_dokumen.toLowerCase().includes(keyword) ||
               a.pengirim.toLowerCase().includes(keyword) ||
               folderName.includes(keyword) ||
               a.tanggal.includes(keyword);
    });

    if(filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #718096; padding: 20px;">Belum ada data dokumen arsip.</td></tr>`;
        return;
    }

    let html = '';
    filtered.forEach((a, index) => {
        const folderObj = globalData.folders.find(f => f.id === a.folder_id);
        const folderName = folderObj ? folderObj.nama_folder : 'Tanpa Folder';
        
        let berkasHtml = '<span style="color: #a0aec0; font-style: italic; font-size: 13px;">Tidak Ada</span>';
        if(a.file_data) {
            const byteCharacters = atob(a.file_data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            let mime = 'application/octet-stream';
            if(a.file_tipe === 'PDF') mime = 'application/pdf';
            else if(['JPG', 'JPEG', 'PNG'].includes(a.file_tipe)) mime = 'image/' + a.file_tipe.toLowerCase();
            
            const blob = new Blob([byteArray], { type: mime });
            const blobUrl = URL.createObjectURL(blob);
            berkasHtml = `<a href="${blobUrl}" target="_blank" class="btn-file">📄 Lihat File</a>`;
        }

        html += `
        <tr>
            <td style="text-align: center;">${index + 1}</td>
            <td>${a.tanggal}</td>
            <td><span class="badge-folder">📁 ${folderName}</span></td>
            <td>
                <b>${a.judul_dokumen}</b>
                ${a.keterangan ? `<div style="font-size: 12px; color: #666; margin-top:3px;">${a.keterangan}</div>` : ''}
            </td>
            <td>${a.pengirim}</td>
            <td>${a.lokasi_fisik}</td>
            <td style="text-align: center;">${berkasHtml}</td>
            <td style="text-align: center;">
                <button class="btn-danger" onclick="hapusArsip(${a.id})">Hapus</button>
            </td>
        </tr>`;
    });
    tbody.innerHTML = html;
}

async function hapusArsip(id) {
    if(!confirm('Yakin ingin menghapus arsip ini?')) return;
    const res = await fetch(`/api/arsip/${id}`, { method: 'DELETE' });
    const data = await res.json();
    if(data.success) {
        loadData();
    } else {
        alert('Gagal menghapus arsip');
    }
}
</script>
</body>
</html>
